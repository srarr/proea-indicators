name: Compile on TradingView

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Mondays: catches changes in TradingView's compiler
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Pine v6 compile check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/compile.mjs
